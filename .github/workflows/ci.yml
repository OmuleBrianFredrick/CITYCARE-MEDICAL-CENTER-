name: Verify CityCare

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: citycare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: citycare_ci
          POSTGRES_USER: citycare_ci
          POSTGRES_PASSWORD: citycare_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U citycare_ci -d citycare_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      BCRYPT_ROUNDS: '4'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: citycare_ci
      DB_USERNAME: citycare_ci
      DB_PASSWORD: citycare_ci_password
      DB_SCHEMA: citycare
      DB_SSLMODE: disable
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13'
          cache: npm

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Prepare application key
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit frontend dependencies
        run: npm audit --package-lock-only --audit-level=high

      - name: Verify PHP code style
        run: vendor/bin/pint --test

      - name: Build frontend assets
        run: npm run build

      - name: Prepare private PostgreSQL schema
        run: php artisan citycare:database-prepare

      - name: Verify clean PostgreSQL migration and seed
        run: php artisan migrate:fresh --seed --force

      - name: Verify production caches and scheduler
        run: |
          php artisan schedule:list
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan optimize:clear

      - name: Run automated tests against PostgreSQL
        run: php artisan test
